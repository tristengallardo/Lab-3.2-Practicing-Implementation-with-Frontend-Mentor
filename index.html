<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | QR code component w/ BootStrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100 text-center">
  <div class="bg-white rounded-4 p-3 m-3" style="width:320px;">
  <img src="./images/image-qr-code.png" alt="Qr code" class="img-fluid rounded-4 mb-3" >
  <h1 class="fw-bold fs-4 text-dark mb-3">Improve your front-end skills by building projects</h1>

  <p class="text-secondary px-2 mb-3">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>

  <footer class="small text-secondary">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Tristen Gallardo</a>.
  </footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
